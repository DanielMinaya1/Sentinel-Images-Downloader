repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  # Run via `poetry run`, not a separate hermetic env, so the exact
  # ruff/mypy versions pinned in pyproject.toml are always what runs.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: poetry run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: poetry run ruff format
        language: system
        types_or: [python, markdown]

      - id: mypy
        name: mypy
        entry: poetry run mypy downloader
        language: system
        pass_filenames: false
        types: [python]
