[tool.poetry]
name = "sentinel-images-downloader"
version = "2026.04.26"
description = "A Python script to easily download Sentinel-2 satellite imagery from Copernicus Browser by specifying tile IDs, years, and bands."
authors = ["Daniel Minaya Vargas <dminaya@dim.uchile.cl>"]
keywords = ["sentinel-2", "downloader", "satellite imagery"]
packages = [{ include = "downloader" }]

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.32.3"
rasterio = "^1.3.10"
python-dotenv = "^1.0.1"
tqdm = "^4.66.4"
shapely = "^2.1.2"
geopandas = "^1.1.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.16.8"
mypy = "^2.3.1"
pre-commit = "^4.6.2"

[tool.poetry.urls]
repository = "https://github.com/DanielMinaya1/Sentinel-Images-Downloader"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
